name: Validate plugin manifests and artifact contracts

on:
  push:
    paths:
      - ".claude-plugin/**"
      - "plugins/**/.claude-plugin/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "examples/sample-run/**"
      - "README.md"
      - "MAINTAINERS.md"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/**/.claude-plugin/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "examples/sample-run/**"
      - "README.md"
      - "MAINTAINERS.md"

jobs:
  validate-json:
    name: Validate marketplace & plugin JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null && echo "✓ .claude-plugin/marketplace.json is valid JSON"

      - name: Validate plugin.json files
        run: |
          for f in $(find plugins -name "plugin.json" -path "*/.claude-plugin/*"); do
            python3 -m json.tool "$f" > /dev/null && echo "✓ $f is valid JSON"
          done

      - name: Check marketplace name is not reserved
        run: |
          python3 - <<'EOF'
          import json, sys
          with open(".claude-plugin/marketplace.json") as f:
              data = json.load(f)
          name = data.get("name", "")
          reserved = [
              "claude-code-marketplace", "claude-code-plugins", "claude-plugins-official",
              "anthropic-marketplace", "anthropic-plugins", "agent-skills",
              "knowledge-work-plugins", "life-sciences"
          ]
          if name in reserved:
              print(f"ERROR: marketplace name '{name}' is reserved by Anthropic", file=sys.stderr)
              sys.exit(1)
          if not name.replace("-", "").isalnum():
              print(f"ERROR: marketplace name '{name}' must be kebab-case (letters, digits, hyphens only)", file=sys.stderr)
              sys.exit(1)
          print(f"✓ marketplace name '{name}' is valid and not reserved")
          EOF

      - name: Check symlinks resolve (local paths)
        run: |
          for f in $(find plugins -type l); do
            if [ ! -e "$f" ]; then
              echo "ERROR: broken symlink: $f -> $(readlink $f)"
              exit 1
            fi
            echo "✓ $f"
          done

  validate-artifact-contracts:
    name: Validate artifact contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run validator and ingestion tests
        run: python -m pytest tests/test_validate_artifact.py tests/test_prompt_registry.py tests/test_log_event.py tests/test_regression_evals.py tests/test_ingest.py

      - name: Validate sample run artifacts
        run: |
          python scripts/validate_artifact.py examples/sample-run/eval-brief.md schemas/eval-brief.schema.json
          python scripts/validate_artifact.py examples/sample-run/phase1b-competitive-raw.md schemas/phase1b-competitive.schema.json
          python scripts/validate_artifact.py examples/sample-run/phase2-synthesis.md schemas/phase2-synthesis.schema.json
